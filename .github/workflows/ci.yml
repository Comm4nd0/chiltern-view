name: CI

# Enforces the project's non-negotiable parity rule: web and mobile must stay in
# lockstep. Every push / PR runs the backend tests AND both front-end check sets,
# so a feature can't land on one platform without the other building cleanly.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret
        run: python manage.py test --verbosity=2

  web:
    name: Web (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Lint
        working-directory: web
        run: npm run lint

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze
        working-directory: frontend
        run: flutter analyze
      - name: Test
        working-directory: frontend
        run: flutter test
