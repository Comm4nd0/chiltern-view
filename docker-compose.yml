# chiltern_view backend stack — intended to run on the Luma001 Docker host.
#   docker compose up -d --build
# Copy .env.example to .env and adjust secrets before deploying.

# Shared by the backend API and the scheduler (same image, same config).
x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DATABASE_URL: postgres://${POSTGRES_USER:-chiltern}:${POSTGRES_PASSWORD:-chiltern}@db:5432/${POSTGRES_DB:-chiltern_view}
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  # Optional: auto-create an admin user on first boot.
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
  # Web push (VAPID); leave empty to disable browser reminders.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-admin@example.com}
  PUSH_REMINDER_HOUR: ${PUSH_REMINDER_HOUR:-8}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chiltern_view}
      POSTGRES_USER: ${POSTGRES_USER:-chiltern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chiltern}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chiltern} -d ${POSTGRES_DB:-chiltern_view}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Runs the recurring jobs (weather reminders + web-push reminders). Same image
  # and env as the backend; the entrypoint is skipped so it doesn't re-run
  # migrations. Both commands are idempotent (one frost reminder per night, one
  # digest per browser per day, one ping per timed task per day), so the loop
  # self-heals after restarts. A 5-minute loop keeps clock-timed task pings (e.g.
  # the 07:30 dog feed) landing promptly — they fire on the first run at/after
  # their time.
  scheduler:
    build: ./backend
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    command: sh -c "while true; do python manage.py sync_weather_tasks; python manage.py send_push_reminders; sleep 300; done"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
